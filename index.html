    function createCategoryNav() {
      const container = document.getElementById('timeline-container');
      const nav = document.createElement('div');
      nav.className = 'category-nav';
      nav.setAttribute('role','tablist');
      nav.setAttribute('aria-label','Dimensões do PortoUX');

      plotCategories.forEach(cat => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'category-button-html';
        button.id = `tab-${cat.id}`;
        button.setAttribute('role','tab');
        button.setAttribute('aria-controls',`panel-${cat.id}`);
        button.setAttribute('aria-selected','false');
        button.style.setProperty('--category-color',cat.colour);
        button.innerHTML = `<span class="category-code">${cat.id}</span><span class="category-text">${cat.shortLabel}</span><span class="category-full">${cat.category}</span>`;
        button.addEventListener('click',()=>toggleCategory(cat,button));
        nav.appendChild(button);
      });
      container.appendChild(nav);
    }

      if(fields.length){const groups={temporal:[],medida:[],categoria:[],estado:[]};fields.forEach(f=>groups[f.type]?.push(f.label));const interpreted=[];if(groups.medida.length)interpreted.push('Medidas: '+groups.medida.join(', ')+'.');if(groups.categoria.length)interpreted.push('Categorias e recortes: '+groups.categoria.join(', ')+'.');if(groups.temporal.length)interpreted.push('Tempo: '+groups.temporal.join(', ')+'.');if(groups.estado.length)interpreted.push('Estado: '+groups.estado.join(', ')+'.');appendTipList(wrap,'Como interpretei os campos',interpreted)}
      const analyses=[];
      if(/moviment|volume|mph/.test(normalized)&&/(data|mes|mês|ano)/.test(normalized))analyses.push('Como a movimentação ou produtividade evolui ao longo do tempo?');
      if(/terminal|departamento|equipamento|carga/.test(normalized)&&/(moviment|volume|mph|espera|perman|ocupacao|ocupação)/.test(normalized))analyses.push('Quais categorias apresentam os maiores e menores valores?');
      if(/status|situacao|situação|estado/.test(normalized))analyses.push('Como as operações estão distribuídas entre os estados informados?');
      if(/meta|limite|capacidade/.test(normalized))analyses.push('Quais medidas estão dentro ou fora da referência definida?');
      if(!analyses.length)analyses.push('Qual é a situação geral que precisa ser entendida primeiro?','Quais categorias precisam ser comparadas?','Há evolução temporal ou registros que precisam de detalhamento?');
      appendTipList(wrap,'O que seus dados permitem analisar',analyses.slice(0,4));
      const structure=['Visão geral: destaque somente os indicadores essenciais para entender o cenário inicial.'];
      if(/data|mes|mês|ano/.test(normalized))structure.push('Evolução: use linha quando a pergunta for acompanhar uma medida ao longo do tempo.');
      if(/terminal|departamento|equipamento|carga|tipo/.test(normalized))structure.push('Comparações: use barras entre categorias; se não houver ordem natural, ordene do maior para o menor valor.');
      if(/status|situacao|situação|estado/.test(normalized))structure.push('Status: se forem estados categóricos, como Em operação, Parado e Aguardando, trate-os como categorias. Gauge só deve ser considerado se o status vier de uma medida comparada a meta, limite, capacidade ou faixa conhecida.');
      if(/navio|registro|detalhe|id|ticket|operacao|operação/.test(normalized))structure.push('Detalhamento: mantenha registros e atributos específicos em tabela ou segundo nível quando forem necessários para consulta.');
      structure.push('Filtros: escolha apenas recortes úteis à exploração e mantenha as seleções ativas visíveis.');
      appendTipList(wrap,'Estrutura sugerida',structure);
      const note=document.createElement('small');note.className='assistant-context-note';note.textContent='O mesmo campo pode assumir representações diferentes conforme a pergunta. O PortoUX não recomenda um gráfico apenas pelo nome do campo.';wrap.appendChild(note);wrap.appendChild(assistantActionButtons(['Ver prévia do painel','Sugerir paleta','Revisar estrutura']));return wrap;
    }

    function gaugeStatusNode(){
      const wrap=document.createElement('div');wrap.className='assistant-recommendation';wrap.innerHTML='<span class="assistant-recommendation-label">Status e gauge</span><strong class="assistant-recommendation-title">Pode ser adequado, dependendo do que “status” representa</strong><p>Se o status vier de uma medida contínua comparada a uma meta, limite, capacidade ou faixa conhecida, o gauge pode ser considerado. Se forem estados como “Em operação”, “Parado” e “Aguardando”, prefira uma representação categórica.</p>';
      appendTipList(wrap,'Exemplos',['Ocupação 78% com limite de 80%: gauge ou KPI com referência podem funcionar.','SLA 92% com meta de 95%: mostre valor e referência; gauge é uma opção, não uma obrigação.','Em operação / Parado / Aguardando: use categorias, não um gauge.']);return wrap;
    }

    function fallbackNode(){
      const wrap=document.createElement('div');wrap.className='assistant-recommendation';wrap.innerHTML='<span class="assistant-recommendation-label">Limite da base</span><strong class="assistant-recommendation-title">Não encontrei uma diretriz específica para essa pergunta</strong><p>O PortoUX pode orientar escolha de visualizações, organização do painel, clareza visual, hierarquia, interação, acessibilidade e contextualização dos dados. Se a questão estiver relacionada a esses temas, reformule pelo objetivo da análise e eu tento orientar sem inventar uma regra.</p>';return wrap;
    }

    function buildVisualGuide(panel,category){
      if(!category.visualGuide)return;
      const section=document.createElement('section');section.className='visual-assistant';section.innerHTML=`<div class="visual-assistant-head"><div><span class="eyebrow">Assistente PortoUX</span><h3>Como posso ajudar com seu dashboard?</h3><p>Descreva o que precisa criar, informe os dados disponíveis ou conte uma ideia que queira revisar. O assistente aplica as regras do PortoUX sem IA generativa.</p></div><button type="button" class="assistant-new-chat" aria-label="Iniciar nova conversa">＋ Nova conversa</button></div>`;
      const shell=document.createElement('div');shell.className='visual-assistant-shell';
      const contextStrip=document.createElement('div');contextStrip.className='assistant-context-strip';contextStrip.hidden=true;
      const chat=document.createElement('div');chat.className='visual-assistant-chat';chat.setAttribute('aria-live','polite');
      const suggestions=document.createElement('div');suggestions.className='assistant-suggestions';
      const form=document.createElement('form');form.className='visual-assistant-form';form.innerHTML='<label class="sr-only" for="visual-assistant-input">Descreva sua análise ou painel</label><input id="visual-assistant-input" type="text" autocomplete="off" placeholder="Descreva o painel que precisa criar ou informe os dados que possui."><button type="submit">Enviar</button>';
      let conversationContext={lastQuestion:'',lastRule:null,panelContext:null,paletteIndex:0,activePalette:null,previewTheme:'dark',blueprint:null,mode:null,tags:[]};
      const starterLabels=['Montar meu painel','Escolher visualização','Avaliar uma ideia','Melhorar uma visualização','Criar uma paleta','Painel para TV'];
      const modeCopy={
        'Montar meu painel':{message:'Conte o que você precisa acompanhar e, se souber, quais dados ou campos estão disponíveis. Não precisa definir os gráficos antes.',placeholder:'Ex.: Preciso criar um painel de SLA. Tenho data, departamento, chamados, percentual de SLA e meta.'},
        'Escolher visualização':{message:'Diga o que você quer mostrar ou comparar. A visualização será escolhida pela pergunta analítica, não apenas pelo nome do campo.',placeholder:'Ex.: Quero comparar movimentação entre terminais.'},
        'Avaliar uma ideia':{message:'Descreva como você pensou em organizar o painel. Ele não precisa estar pronto.',placeholder:'Ex.: Pensei em 8 KPIs no topo, duas roscas e uma tabela.'},
        'Melhorar uma visualização':{message:'Descreva a visualização atual e o que está dificultando a leitura. Você não precisa saber o nome técnico do problema.',placeholder:'Ex.: Meu gráfico tem muitas categorias e cores e está difícil de comparar.'},
        'Criar uma paleta':{message:'Posso sugerir uma paleta ou trabalhar a partir de uma cor que você já utiliza. Se já houver uma estrutura definida na conversa, a prévia respeitará essa estrutura.',placeholder:'Ex.: Quero uma paleta escura usando #176B87 como cor principal.'},
        'Painel para TV':{message:'Conte quais informações precisam ser acompanhadas na TV. Vou priorizar leitura à distância, estado atual e independência de interação.',placeholder:'Ex.: Painel para TV com indicadores do dia e situações críticas.'}
      };
      function renderSuggestions(labels=starterLabels){suggestions.innerHTML='';labels.forEach(label=>{const button=document.createElement('button');button.type='button';button.className='assistant-suggestion';button.textContent=label;suggestions.appendChild(button)})}
      function addTag(tag){if(tag&&!conversationContext.tags.includes(tag)){conversationContext.tags.push(tag);conversationContext.tags=conversationContext.tags.slice(-5)}}
      function updateContextStrip(){
        if(!conversationContext.tags.length){contextStrip.hidden=true;contextStrip.innerHTML='';return}
        contextStrip.hidden=false;contextStrip.innerHTML='<span>Contexto atual:</span>';
        conversationContext.tags.forEach(tag=>{const chip=document.createElement('button');chip.type='button';chip.className='assistant-context-chip';chip.dataset.removeContext=tag;chip.innerHTML=`${tag}<b aria-hidden="true">×</b>`;chip.setAttribute('aria-label',`Remover contexto ${tag}`);contextStrip.appendChild(chip)});
      }
      function activateMode(label){
        const copy=modeCopy[label];if(!copy)return false;
        conversationContext.mode=label;addTag(label);updateContextStrip();
        addAssistantMessage(chat,'assistant',copy.message);renderSuggestions([]);
        const input=form.querySelector('input');if(input){input.placeholder=copy.placeholder;input.focus()}return true;
      }
      function resetConversation(){
        conversationContext={lastQuestion:'',lastRule:null,panelContext:null,paletteIndex:0,activePalette:null,previewTheme:'dark',blueprint:null,mode:null,tags:[]};chat.innerHTML='';updateContextStrip();
        addAssistantMessage(chat,'assistant','Conte o painel que precisa montar, os dados que possui ou o que deseja analisar. Se houver contexto suficiente, eu respondo direto; se faltar algo decisivo, faço apenas uma pergunta curta.');
        renderSuggestions();const input=form.querySelector('input');if(input){input.value='';input.placeholder='Descreva o painel que precisa criar ou informe os dados que possui.';input.focus()}
      }
      function refreshBlueprint(baseText=''){
        const source=[conversationContext.lastQuestion,baseText].filter(Boolean).join(' ');
        conversationContext.blueprint=buildPanelBlueprint(source,conversationContext.lastRule,conversationContext.panelContext);
      }
      function submitQuestion(question){
        const clean=(question||'').trim();if(!clean)return;addAssistantMessage(chat,'user',clean);const normalized=normalizeAssistantText(clean);const portTerms=detectPortTerms(clean);const activeMode=conversationContext.mode;conversationContext.mode=null;
        if(activeMode)addTag(activeMode);
        if(/somente indicadores|apenas indicadores|so indicadores|somente kpi|apenas kpi|painel de indicadores/.test(normalized))addTag('Somente indicadores');
        if(/tv|televisao|monitoramento/.test(normalized))addTag('Painel para TV');
        if(/executivo|diretoria|gerencial/.test(normalized))addTag('Executivo');
        if(/operacional|operacao|turno/.test(normalized))addTag('Operacional');
        if(/mensal|por mes|mês|evolu|ao longo/.test(normalized))addTag('Evolução temporal');
        if(/compar|por terminal|por departamento|ranking/.test(normalized))addTag('Comparação');
        if(/meta|limite|capacidade|sla/.test(normalized))addTag('Meta / referência');
        updateContextStrip();

        if((/status/.test(normalized)&&/gauge|velocimetro|velocímetro/.test(normalized))||(/gauge|velocimetro|velocímetro/.test(normalized)&&/estado|situacao|situação/.test(normalized))){conversationContext.lastQuestion=clean;refreshBlueprint(clean);addAssistantMessage(chat,'assistant',gaugeStatusNode());renderSuggestions(['Ver prévia do painel','Sugerir paleta','Montar meu painel']);return}
        if((/preciso|quero|gostaria|ajude/.test(normalized)&&/(montar|criar|fazer|estruturar).*(painel|dashboard)/.test(normalized)&&detectFieldHints(clean).length>=2)||(/tenho|campos|dados|informacoes|informações/.test(normalized)&&detectFieldHints(clean).length>=3)||activeMode==='Montar meu painel'){
          conversationContext.lastQuestion=clean;conversationContext.panelContext=detectPanelContext(clean)||conversationContext.panelContext;refreshBlueprint(clean);addTag('Dados informados');updateContextStrip();addAssistantMessage(chat,'assistant',panelFromFieldsNode(clean));renderSuggestions(['Ver prévia do painel','Sugerir paleta','Avaliar uma ideia']);return
        }
        if(isBroadDashboardNeed(clean,activeMode)){
          conversationContext.lastQuestion=clean;conversationContext.panelContext=detectPanelContext(clean)||conversationContext.panelContext;conversationContext.lastRule=null;refreshBlueprint(clean);addTag('Estrutura de painel');updateContextStrip();addAssistantMessage(chat,'assistant',dashboardNeedNode(clean,conversationContext.blueprint));renderSuggestions(['Ver prévia do painel','Sugerir paleta','Avaliar uma ideia']);return
        }
        if(/quantas?\s+(visualiz|graf|gráf)|numero de (visualiz|graf)|número de (visualiz|graf)|quantos? graficos|quantos? gráficos/.test(normalized)){addAssistantMessage(chat,'assistant',quantityRecommendationNode(clean));renderSuggestions(['Avaliar uma ideia','Sugerir paleta','Escolher visualização']);return}
        if((/avaliar|avalie|minha ideia|estou pensando|pensei em|pretendo colocar|quero colocar/.test(normalized)&&/(painel|dashboard|kpi|graf|gráf|rosca|tabela|filtro)/.test(normalized))||(/\d+\s*kpis?/.test(normalized)&&/(rosca|tabela|graf|gráf|filtro)/.test(normalized))||activeMode==='Avaliar uma ideia'){
          conversationContext.lastQuestion=clean;refreshBlueprint(clean);addAssistantMessage(chat,'assistant',evaluateIdeaNode(clean));renderSuggestions(['Ver prévia do painel','Sugerir paleta','Montar meu painel']);return
        }
        if(/paleta|hex|cores|cor principal|cor do painel|coloracao|coloração|azul|laranja|verde|turquesa|ciano|amarelo|ambar|âmbar|vermelho|coral|roxo|violeta|rosa|cinza/.test(normalized)||activeMode==='Criar uma paleta'){
          const isAnother=/outra|nova|diferente|mais uma/.test(normalized);const custom=customPaletteFromText(clean);
          if(/fundo claro|tema claro/.test(normalized))conversationContext.previewTheme='light';
          if(/fundo escuro|tema escuro/.test(normalized))conversationContext.previewTheme='dark';
          if(custom){conversationContext.activePalette=custom;addTag('Paleta personalizada')}
          else if(isAnother){conversationContext.paletteIndex=(conversationContext.paletteIndex+1)%PORTOUX_PALETTES.length;conversationContext.activePalette=PORTOUX_PALETTES[conversationContext.paletteIndex]}
          else if(/categor|series|séries/.test(normalized)){conversationContext.paletteIndex=2;conversationContext.activePalette=PORTOUX_PALETTES[2]}
          else if(!conversationContext.activePalette)conversationContext.activePalette=PORTOUX_PALETTES[conversationContext.paletteIndex];
          refreshBlueprint();updateContextStrip();addAssistantMessage(chat,'assistant',paletteNode(clean,conversationContext.paletteIndex,conversationContext));renderSuggestions(['Outra paleta','Ver prévia do painel','Revisar estrutura']);return
        }
        if(/grid|grade|borda|legenda|eixo|escala|tipografia|fonte do graf|fonte no graf/.test(normalized)||activeMode==='Melhorar uma visualização'){conversationContext.lastQuestion=clean;addAssistantMessage(chat,'assistant',visualCleanupNode(normalized));renderSuggestions(['Sugerir paleta','Avaliar uma ideia','Escolher visualização']);return}
        if(/normal|critico|crítico|alerta|desvio|fila|congestionamento|estado atual|situacao atual|situação atual/.test(normalized)&&portTerms.length){addAssistantMessage(chat,'assistant',stateExceptionNode());renderSuggestions(['Painel para TV','Acompanhar evolução','Comparar categorias']);return}
        if(/visao geral|visão geral|granularidade|nivel de analise|nível de análise|detalhamento por|consolidado.*por/.test(normalized)){addAssistantMessage(chat,'assistant',levelsNode());return}
        const panelContext=detectPanelContext(clean);if(panelContext){conversationContext.panelContext=panelContext;conversationContext.lastQuestion=clean;addTag(panelContext.label);refreshBlueprint(clean);updateContextStrip();addAssistantMessage(chat,'assistant',panelRecommendationNode(panelContext,portTerms,clean));renderSuggestions(['Ver prévia do painel','Sugerir paleta','Avaliar uma ideia']);return}
        if(/ultima atualizacao|última atualização|atualizacao|atualização|fonte dos dados|periodo do indicador|período do indicador|unidade do indicador/.test(normalized)){addAssistantMessage(chat,'assistant',dataContextNode(normalized));renderSuggestions(['Escolher visualização','Painel para TV','Avaliar uma ideia']);return}
        if(/sigla|abreviacao|abreviação|acronimo|acrônimo/.test(normalized)){addAssistantMessage(chat,'assistant',languageNode());return}
        const unknown=detectUnknownAcronyms(clean);if(unknown.length){addAssistantMessage(chat,'assistant',acronymNode(unknown));renderSuggestions(['Comparar categorias','Acompanhar evolução','Meta × realizado','Mostrar valor atual']);return}
        const expanded=conversationContext.lastQuestion&&/^(e |e se|tambem|também|agora|nesse caso|e para)/i.test(clean)?`${conversationContext.lastQuestion} ${clean}`:clean;
        const result=analyzeVisualizationQuestion(expanded);if(result.type==='recommendation'){conversationContext.lastQuestion=expanded;conversationContext.lastRule=result.rule;addTag(result.rule.intent);refreshBlueprint(expanded);updateContextStrip();addAssistantMessage(chat,'assistant',recommendationNode(result.rule,expanded));renderSuggestions(['Ver prévia do painel','Sugerir paleta','Avaliar uma ideia']);return}
        const clarification=document.createElement('div');const textNode=document.createElement('p');textNode.textContent=result.message;clarification.appendChild(textNode);const options=document.createElement('div');options.className='assistant-inline-options';result.options.forEach(option=>{const btn=document.createElement('button');btn.type='button';btn.textContent=option;btn.addEventListener('click',()=>submitQuestion(option));options.appendChild(btn)});clarification.appendChild(options);addAssistantMessage(chat,'assistant',clarification);
      }
      function handleAction(label){
        if(activateMode(label))return;
        if(label==='Outra paleta'){submitQuestion('Quero outra sugestão de paleta');return}
        if(label==='Sugerir paleta'||label==='Criar uma paleta'){submitQuestion('Sugira uma paleta para este painel');return}
        if(label==='Ver prévia do painel'){refreshBlueprint();addAssistantMessage(chat,'assistant',previewOnlyNode(conversationContext));renderSuggestions(['Sugerir paleta','Revisar estrutura']);return}
        if(label==='Revisar estrutura'){activateMode('Avaliar uma ideia');return}
        if(label==='Acompanhar evolução'||label==='Comparar categorias'||label==='Meta × realizado'||label==='Consultar detalhes'||label==='Mostrar valor atual'){submitQuestion(label);return}
        submitQuestion(label);
      }
      suggestions.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;handleAction(button.textContent)});
      chat.addEventListener('click',event=>{
        const themeBtn=event.target.closest('[data-preview-theme]');if(themeBtn){conversationContext.previewTheme=themeBtn.dataset.previewTheme;addTag(conversationContext.previewTheme==='dark'?'Tema escuro':'Tema claro');updateContextStrip();addAssistantMessage(chat,'assistant',previewOnlyNode(conversationContext));return}
        const action=event.target.closest('[data-assistant-action]');if(action){handleAction(action.dataset.assistantAction);return}
      });
      contextStrip.addEventListener('click',event=>{const btn=event.target.closest('[data-remove-context]');if(!btn)return;conversationContext.tags=conversationContext.tags.filter(t=>t!==btn.dataset.removeContext);updateContextStrip()});
      form.addEventListener('submit',event=>{event.preventDefault();const input=form.querySelector('input');submitQuestion(input.value);input.value='';input.focus()});section.querySelector('.assistant-new-chat').addEventListener('click',resetConversation);
      shell.append(contextStrip,chat,suggestions,form);section.appendChild(shell);panel.appendChild(section);resetConversation();
    }


    function createPracticeSection(title, items, className) {
      const section = document.createElement('section');
      section.className = `practice-section ${className}`;
      section.innerHTML = `<h5 class="practice-title">${title}</h5><ul class="practice-list">${items.map(item=>`<li>${item}</li>`).join('')}</ul>`;
      return section;
    }

    function createGuidelineCard(child, index, category) {
      const article = document.createElement('article');
      article.className = 'chart-card';
      article.innerHTML = `
        <div class="card-icon-stage" style="height:180px;min-height:180px"><img src="${child.image}" alt="Ilustração da diretriz ${child.name}" loading="lazy" style="width:100%;height:100%;max-width:none;max-height:none;object-fit:contain;object-position:center"></div>
        <h4 class="chart-name">${child.name}</h4>
        <p class="chart-description">${child.description}</p>
        ${child.usePara ? `<p class="chart-use"><strong>Use para</strong><span>${child.usePara}</span></p>` : ''}
        <div class="practices-container"></div>`;

      const details = article.querySelector('.practices-container');
      details.appendChild(createPracticeSection('Faça',child.faca,'do-section'));
      details.appendChild(createPracticeSection('Evite',child.evite,'dont-section'));
      return article;
    }

    function toggleCategory(category, triggerNode) {
      const infoPanel = document.getElementById('info-panel');
      const buttons = document.querySelectorAll('.category-button-html');
      const sameOpen = currentOpenCategory === category.id;
      buttons.forEach(btn=>{ btn.classList.remove('active'); btn.setAttribute('aria-selected','false'); });

      if (sameOpen) {
        infoPanel.classList.remove('open');
        infoPanel.innerHTML = '';
        currentOpenCategory = null;
        document.body.classList.add('home-state');
        return;
      }

      currentOpenCategory = category.id;
      document.body.classList.remove('home-state');
      triggerNode.classList.add('active');
      triggerNode.setAttribute('aria-selected','true');
      infoPanel.innerHTML = '';

      const panel = document.createElement('section');
      panel.className = 'info-panel-content';
      panel.id = `panel-${category.id}`;
      panel.setAttribute('role','tabpanel');
      panel.setAttribute('aria-labelledby',`tab-${category.id}`);
      panel.style.setProperty('--category-color',category.colour);

      const intro = document.createElement('div');
      intro.className = 'panel-intro';
      intro.innerHTML = `<div class="panel-kicker">${category.id}</div><h2 class="panel-title">${category.category}</h2><p class="panel-description">${category.description}</p>${category.note ? `<p class="panel-note">${category.note}</p>` : ''}`;
      panel.appendChild(intro);

      const example = document.createElement('button');
      example.type = 'button';
      example.className = 'panel-example example-trigger';
      example.dataset.img = category.example.img;
      example.dataset.caption = category.example.text;
      example.innerHTML = `<img class="example-thumb" src="${category.example.img}" alt="Prévia do exemplo aplicado de ${category.category}"><span class="example-copy"><span class="example-label">Exemplo aplicado</span><span class="example-text">${category.example.text}</span><small>Exemplo ilustrativo. A configuração não constitui um modelo obrigatório de dashboard.</small></span><span class="view-example">Ampliar ↗</span>`;
      panel.appendChild(example);

      const heading = document.createElement('div');
      heading.className = 'cards-heading';
      heading.innerHTML = '<span class="eyebrow">Diretrizes do PortoUX</span><h3>O que observar</h3>';
      panel.appendChild(heading);

      const cards = document.createElement('div');
      cards.className = 'cards-container';
      category.children.forEach((child,index)=>cards.appendChild(createGuidelineCard(child,index,category)));
      panel.appendChild(cards);
      buildVisualGuide(panel,category);

      infoPanel.appendChild(panel);
      infoPanel.classList.add('open');
      requestAnimationFrame(()=>panel.scrollIntoView({behavior:'smooth',block:'start'}));
    }

    function setupModal() {
      const modal = document.getElementById('image-modal');
      const modalImg = modal.querySelector('.image-modal-img');
      const modalCaption = modal.querySelector('.image-modal-caption');
      const closeBtn = modal.querySelector('.image-modal-close');
      function openModal(trigger){
        lastModalTrigger=trigger;
        modalImg.src=trigger.dataset.img;
        modalCaption.textContent=trigger.dataset.caption;
        modal.classList.add('active');
        modal.setAttribute('aria-hidden','false');
        document.body.classList.add('modal-open');
        closeBtn.focus();
      }
      function closeModal(){
        modal.classList.remove('active');
        modal.setAttribute('aria-hidden','true');
        document.body.classList.remove('modal-open');
        modalImg.src='';
        if(lastModalTrigger) lastModalTrigger.focus();
      }
      document.addEventListener('click',event=>{
        const trigger=event.target.closest('.example-trigger');
        if(trigger) openModal(trigger);
      });
      closeBtn.addEventListener('click',closeModal);
      modal.addEventListener('click',event=>{if(event.target===modal)closeModal();});
      document.addEventListener('keydown',event=>{if(event.key==='Escape'&&modal.classList.contains('active'))closeModal();});
    }

    document.body.classList.add('home-state');
    createCategoryNav();
    setupModal();
  </script>
